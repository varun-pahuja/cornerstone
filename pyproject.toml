[project]
name = "silentos-backend"
version = "0.1.0"
description = "SilentOS backend — offline-first multimodal assistive communication"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "psutil>=6.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
inference = [
    "onnxruntime>=1.18",
]
vision = [
    "mediapipe>=0.10",
]
training = [
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
pythonpath = ["backend/src"]
asyncio_mode = "auto"
markers = [
    "slow: slow tests",
    "integration: integration tests",
    "hardware: tests requiring real hardware",
]
